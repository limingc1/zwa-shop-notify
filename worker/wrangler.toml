name = "zwa-shop-notify"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 自定义域名（workers.dev 在国内被干扰，走账户内已激活域名）
routes = [
  { pattern = "zwa.lim1ng.bond", custom_domain = true }
]

# 三个窗口（UTC / 北京时间）：00:20=08:20 主推送；01:30=09:30、04:00=12:00 补偿。
# 掌瓦 8 点整刷新时全国并发易报 201「人数过多」，错峰 + 当场退避 + 多窗口补偿；
# 同一天靠 end_ts 去重只推一次，只有最后窗口失败才报丧。
[triggers]
crons = ["20 0 * * *", "30 1 * * *", "0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "zwa-notify"
database_id = "4bd3333e-4589-4b1c-8341-2c1231ebab46"
